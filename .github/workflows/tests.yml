name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate Claude Skill and Plugin releases
        run: python build_release.py --check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Verify installed wheel entry point
        run: |
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          python -m fidelityflow --version
          fidelityflow doctor
      - name: Upload Claude upload packages
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: fidelityflow-claude-uploads
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  ocr-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract and Arabic/English language data
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
      - name: Install OCR and visual dependencies
        run: python -m pip install -e ".[ocr,vision]"
      - name: Run real image and scanned-PDF OCR tests
        run: python -m unittest discover -s tests -p "test_ocr_integration.py" -v
