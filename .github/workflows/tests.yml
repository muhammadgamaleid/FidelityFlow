name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate Claude Skill release
        run: python build_release.py --check
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
      - name: Verify installed wheel entry point
        run: |
          python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
          python -m fidelityflow --version
          fidelityflow doctor
