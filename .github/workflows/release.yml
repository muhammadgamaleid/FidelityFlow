name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate and build Claude packages
        run: python build_release.py --check
      - name: Generate package checksums
        run: |
          cd dist
          sha256sum fidelityflow-claude-ai.zip fidelityflow-plugin.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/fidelityflow-claude-ai.zip \
            dist/fidelityflow-plugin.zip \
            dist/SHA256SUMS.txt \
            --title "FidelityFlow ${GITHUB_REF_NAME}" \
            --generate-notes
