name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fidelityflow-release-v0.6.0
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Validate and build Claude packages
        run: python build_release.py --check
      - name: Generate package checksums
        run: |
          cd dist
          sha256sum fidelityflow-claude-ai.zip fidelityflow-plugin.zip > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.6.0" \
            dist/fidelityflow-claude-ai.zip \
            dist/fidelityflow-plugin.zip \
            dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "FidelityFlow v0.6.0" \
            --generate-notes
      - name: Keep main as the only long-lived branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in \
            "feature/source-mapping-v0.6" \
            "release/v0.6.0-professionalization" \
            "dependabot/github_actions/actions/setup-python-7" \
            "release/v0.6.0"; do
            if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted branch: ${branch}"
            fi
          done
