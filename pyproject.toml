[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fidelityflow"
version = "0.4.0"
description = "Claude-focused context-efficiency toolkit with cached file retrieval, optional local image/PDF OCR, conservative Claude Code output filtering, and evidence-backed project memory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4,<7"]
ocr = ["Pillow>=10,<13", "pytesseract>=0.3.13", "PyMuPDF>=1.24,<2", "pypdf>=4,<7"]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "pypdf>=4,<7"]

[project.scripts]
fidelityflow = "fidelityflow.__main__:main"
fflearn = "fidelityflow.learning.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fidelityflow*", "fidelityflow_learning*", "skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
